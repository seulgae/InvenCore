# On-demand Unix socket connection to the Ubuntu host query service.
services:
  backend:
    environment:
      FEATURE_SERVER_CAPACITY_ENABLED: "true"
      SERVER_CAPACITY_MODE: host
      HOST_CAPACITY_SOCKET: /run/invencore-host/capacity.sock
    volumes:
      - type: bind
        source: ${HOST_CAPACITY_DIR:-/run/invencore-host}
        target: /run/invencore-host
        read_only: true
        bind:
          create_host_path: false
