schemaVersion: '2.2'
description: Deploy an InvenCore release using the root-owned installer on the target EC2 instance
parameters:
  ReleaseId:
    type: String
    allowedPattern: '^[a-f0-9]{40}-[0-9]+-[0-9]+$'
    interpolationType: ENV_VAR
  Sha256:
    type: String
    allowedPattern: '^[a-f0-9]{64}$'
    interpolationType: ENV_VAR
mainSteps:
  - action: aws:runShellScript
    name: deployRelease
    inputs:
      timeoutSeconds: '600'
      runCommand:
        - 'bash /usr/local/sbin/invencore-deploy "$SSM_ReleaseId" "$SSM_Sha256"'
