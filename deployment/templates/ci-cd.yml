# REFERENCE TEMPLATE: inactive here. Review docs/AWS_CICD.md before copying to .github/workflows/.
name: InvenCore AWS release
on:
  workflow_dispatch:
  # After the first successful manual release, optionally add push: { branches: [main] }.
permissions:
  contents: read
concurrency:
  group: invencore-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
      - name: Validate and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Test and build backend
        run: |
          chmod +x backend/gradlew
          ./backend/gradlew -p backend --no-daemon clean test bootJar
      - name: Package one immutable release
        run: bash deployment/templates/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: invencore-${{ github.run_id }}
          overwrite: true
          path: |
            release.tar.gz
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: invencore-${{ github.run_id }}
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: invencore-${{ github.run_id }}
      - name: Validate release and upload private artifact
        run: |
          set -Eeuo pipefail
          : "${AWS_REGION:?}" "${ARTIFACT_BUCKET:?}" "${EC2_INSTANCE_ID:?}"
          [[ "$EC2_INSTANCE_ID" =~ ^i-[a-f0-9]{8,17}$ ]]
          sha256sum -c release.tar.gz.sha256
          aws s3 cp release.tar.gz "s3://$ARTIFACT_BUCKET/releases/$RELEASE_ID/release.tar.gz" --sse AES256 --only-show-errors
      - name: Deploy through the reviewed SSM document
        run: |
          set -Eeuo pipefail
          checksum=$(sha256sum release.tar.gz | awk '{print $1}')
          parameters=$(jq -n --arg id "$RELEASE_ID" --arg sha "$checksum" '{ReleaseId:[$id],Sha256:[$sha]}')
          command_id=$(aws ssm send-command --document-name InvenCoreDeploy --instance-ids "$EC2_INSTANCE_ID" --parameters "$parameters" --timeout-seconds 600 --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          # The built-in command-executed waiter stops after about 100s. Allow up to 10 minutes here.
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo 'Release and health checks passed'; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
                exit 1 ;;
            esac
            sleep 5
          done
          echo 'SSM result timed out; inspect the command before sending another release' >&2
          exit 1
