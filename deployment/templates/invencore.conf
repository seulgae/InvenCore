# HTTP origin for initial checks, or behind an HTTPS ALB restricted by security group.
# Public release requires HTTPS; see docs/AWS_CICD.md.
server {
    listen 80 default_server;
    server_name _;
    root /srv/invencore/current/frontend;
    index index.html;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $invencore_proto;
        proxy_read_timeout 120s;
    }
    # Keep hashed assets from older releases so already-open tabs can still lazy-load their chunks.
    location ^~ /assets/ {
        alias /srv/invencore/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
