# Full main config for a NEW dedicated server; compare with any existing nginx config before installing.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    map $http_x_forwarded_proto $invencore_proto {
        default $scheme;
        https https;
    }
    include /etc/nginx/conf.d/*.conf;
}
