name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Node.js 세팅
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & Build
        # [핵심] 여기에 환경 변수를 강제로 주입합니다.
        env:
          VITE_API_URL: ""
        run: |
          npm install
          npm run build
          # VITE_API_URL을 빈 값("")으로 설정했으므로, 
          # 빌드된 결과물은 자동으로 현재 도메인(/api/...)을 사용하게 됩니다.

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Deploy to Server
        run: |
          # 1. 권한 확보
          ssh -o StrictHostKeyChecking=no ec2-user@52.78.176.155 "sudo chown -R ec2-user:ec2-user /var/www/invencore"
          
          # 2. 파일 전송
          scp -r -o StrictHostKeyChecking=no dist/* ec2-user@52.78.176.155:/var/www/invencore/
          
          # 3. 권한 복구 및 Nginx 리로드
          ssh -o StrictHostKeyChecking=no ec2-user@52.78.176.155 << 'EOF'
            sudo chown -R nginx:nginx /var/www/invencore
            sudo chmod -R 755 /var/www/invencore
            # 웹 컨텐츠용 보안 컨텍스트 설정 (안전빵)
            sudo chcon -R -t httpd_sys_content_t /var/www/invencore
            sudo systemctl reload nginx
            echo "🎉 Frontend Deployed Successfully!"
          EOF