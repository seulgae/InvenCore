name: Deploy to Lightsail

on:
  push:
    branches:
      - main  # main 브랜치 푸시 시 배포

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

    - name: Copy files to Lightsail
      run: |
        scp -o StrictHostKeyChecking=no -r ./ ec2-user@52.78.176.155:/home/ec2-user/app

    - name: Deploy on Lightsail
      run: |
        ssh -o StrictHostKeyChecking=no ec2-user@52.78.176.155 << 'EOF'
        cd /home/ec2-user/app
        # 예: 백엔드 실행 (jar 파일 기준)
        # ./gradlew build
        # nohup java -jar build/libs/your-app.jar &
        echo "Deployment completed"
        EOF
