name: Deploy to Lightsail (Amazon Linux 2023)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

    - name: Prepare remote directory
      run: |
        ssh -o StrictHostKeyChecking=no ec2-user@52.78.176.155 "mkdir -p /home/ec2-user/app"

    - name: Copy files to Lightsail
      run: |
        rsync -av --exclude='.git' ./ ec2-user@52.78.176.155:/home/ec2-user/app

    - name: Deploy on Lightsail
      run: |
        ssh -o StrictHostKeyChecking=no ec2-user@52.78.176.155 << 'EOF'
        cd /home/ec2-user/app
        # 필요시 패키지 설치
        sudo dnf install -y java-17-openjdk
        # 백엔드 실행 예제
        # ./gradlew build
        # nohup java -jar build/libs/your-app.jar &
        echo "Deployment completed"
        EOF
