name: Deploy Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'  # backend 폴더가 변경되었을 때만 실행

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend  # 모든 명령어를 backend 폴더 기준으로 실행

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Copy Jar to Server
        run: |
          # scp는 working-directory 영향을 받지 않는 경우가 많아 전체 경로로 지정
          # backend/build/libs/ 아래의 jar 파일을 서버로 전송
          scp -o StrictHostKeyChecking=no build/libs/*.jar ec2-user@13.124.177.193:/home/ec2-user/app/app.jar

      - name: Restart Backend
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@13.124.177.193 << 'EOF'
            # 기존 자바 프로세스 종료
            pgrep -f app.jar | xargs -r kill -9
            sleep 2
            # 백그라운드 실행
            nohup java -jar /home/ec2-user/app/WebApp/app.jar > /home/ec2-user/app/WebApp//app.log 2>&1 &
            echo "Backend Deployed!"
          EOF