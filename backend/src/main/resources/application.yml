# ==========================================
# 공통 설정 (모든 환경에 적용)
# ==========================================
spring:
  application:
    name: InvenCore
  datasource:
    # AWS PostgreSQL example
    # url: jdbc:postgresql://13.124.177.193:5432/invencore
    url: ${DB_URL:jdbc:h2:mem:invencore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    # username: ${DB_USERNAME:invenmaster}
    username: ${DB_USERNAME:sa}
    # password: ${DB_PASSWORD:invencore123}
    password: ${DB_PASSWORD:}
    # driver-class-name: org.postgresql.Driver
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO
    com.inven.core: ${LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  secret: ${JWT_SECRET:v3ryS3cr3tK3yF0rInv3nC0r3B4ck3ndS3rv1c3MustB3L0ng3rThanTh1s}
  expiration: ${JWT_EXPIRATION:1800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

feature:
  aws:
    enabled: ${FEATURE_AWS_ENABLED:false}
  server-capacity:
    enabled: ${FEATURE_SERVER_CAPACITY_ENABLED:false}

# AWS server capacity example
# server-capacity:
#   pem-file: ${SSH_PEM_FILE:LightsailDefaultKey-ap-northeast-2.pem}
#   servers: ${MONITORED_SERVERS:AWS-WAS-01,WAS,13.124.177.193,22,ec2-user,LINUX}

---

# ==========================================
# 개발(dev) 프로필
# ==========================================
spring:
  config:
    activate:
      on-profile: "dev"
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    com.inven.core: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
