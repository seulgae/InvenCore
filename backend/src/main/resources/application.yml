spring:
  application:
    name: InvenCore
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # External mode creates GW topics explicitly before starting its listener.
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      auto-startup: false
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invencore}
    username: ${DB_USERNAME:invencore}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  # CORS는 명시적 Origin 목록으로 처리합니다. 클라이언트 Forwarded 헤더를 신뢰하지 않습니다.
  forward-headers-strategy: none
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO
    com.inven.core: ${LOG_LEVEL:INFO}

app:
  cors:
    # 환경변수를 지정하면 이 기본 목록을 대체하므로 기존 .env.docker도 함께 갱신합니다.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,https://seulgae-server.tailac4b36.ts.net}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# On-demand Ubuntu host queries; SSH remains an explicit optional mode.
feature:
  server-capacity:
    enabled: ${FEATURE_SERVER_CAPACITY_ENABLED:true}
server-capacity:
  mode: ${SERVER_CAPACITY_MODE:host}
  host-socket: ${HOST_CAPACITY_SOCKET:/run/invencore-host/capacity.sock}
  pem-file: ${SSH_PEM_FILE:}
  servers: ${MONITORED_SERVERS:}

benchmark:
  rows: ${BENCHMARK_ROWS:300000}

gw-sync:
  enabled: ${GW_SYNC_ENABLED:true}
  mode: ${GW_SYNC_MODE:external}
  topic: invencore.gw.changed.v1
  group-id: invencore-gw-projection-v1
  cache-ttl-seconds: 60
  publish-delay-ms: 1000

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    cache-enabled: false
    local-cache-scope: STATEMENT

order-lab:
  topic: invencore.order.lab.v1
  publish-delay-ms: 500
  consume-delay-ms: 300
