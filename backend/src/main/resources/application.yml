# ==========================================
# 공통 설정 (모든 환경에 적용)
# ==========================================
spring:
  application:
    name: InvenCore
  # 데이터베이스, JPA, 서버, 로깅 등 공통 설정은 여기에 유지
  datasource:
    url: jdbc:postgresql://13.124.177.193:5432/invencore
    username: invenmaster
    password: invencore123
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: inven_schema
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://13.124.177.193,https://13.124.177.193,http://13.124.177.193:5173"

jwt:
  secret: v3ryS3cr3tK3yF0rInv3nC0r3B4ck3ndS3rv1c3MustB3L0ng3rThanTh1s
  expiration: 1800000

