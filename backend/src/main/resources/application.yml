spring:
  application:
    name: InvenCore
  datasource:
    url: jdbc:h2:mem:invencore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO
    com.inven.core: ${LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

jwt:
  secret: ${JWT_SECRET:v3ryS3cr3tK3yF0rInv3nC0r3B4ck3ndS3rv1c3MustB3L0ng3rThanTh1s}
  expiration: ${JWT_EXPIRATION:1800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# Optional SSH example; no server details or keys are bundled.
feature:
  server-capacity:
    enabled: ${FEATURE_SERVER_CAPACITY_ENABLED:false}
server-capacity:
  pem-file: ${SSH_PEM_FILE:}
  servers: ${MONITORED_SERVERS:}

benchmark:
  rows: ${BENCHMARK_ROWS:300000}
