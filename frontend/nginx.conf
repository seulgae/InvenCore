# Docker Compose service DNS: backend. No host port or real server IP is embedded.
# TLS is terminated by Funnel on this one configured host. Never copy a client-supplied
# X-Forwarded-Proto value. Host selects route metadata; it is not an authentication signal.
map $host $invencore_proto {
    default $scheme;
    seulgae-server.tailac4b36.ts.net https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    location /api/ {
        # Preserve /api and the browser-facing Host port (e.g. localhost:8081).
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $invencore_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
